# Зона для формы заявки: с внешнего контура только сюда.
limit_req_zone $binary_remote_addr zone=leads:10m rate=10r/m;

map $upstream_http_docker_distribution_api_version $docker_distribution_api_version {
    '' 'registry/2.0';
}

# Не слать Connection: upgrade на обычные HTTP-запросы к pgAdmin.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Опрос дашборда pgAdmin не пишем в access-лог — иначе логи съедают диск.
map $request_uri $deluxe_access_log {
    default 1;
    ~*^/healthz 0;
    ~*^/pgadmin/(dashboard/dashboard_stats|misc/heartbeat|misc/cleanup|misc/ping) 0;
}

upstream docker_registry {
    server registry:5000;
}

# Публичный контур сайта: статика фронта + API только через Nginx.
server {
    listen 80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 8m;
    access_log /dev/stdout combined if=$deluxe_access_log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag noindex always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend не публикует порты на хост. Имя резолвится через Docker DNS,
    # чтобы Nginx стартовал даже пока backend ещё закомментирован.
    location /api/ {
        limit_req zone=leads burst=20 nodelay;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /pgadmin {
        return 301 /pgadmin/;
    }

    # pgAdmin только через Nginx, без проброса порта на хост.
    location /pgadmin/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $pgadmin_upstream http://pgadmin:8080;

        rewrite ^/pgadmin/?(.*)$ /$1 break;
        proxy_pass $pgadmin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        client_max_body_size 50m;
    }
}

# Docker Registry снаружи: docker login <SERVER_IP>:5000
# Авторизацию делает сам registry (htpasswd), Nginx только проксирует.
server {
    listen 5000;
    server_name _;

    server_tokens off;
    client_max_body_size 0;
    chunked_transfer_encoding on;

    location /v2/ {
        if ($http_user_agent ~ "^(docker\/1\.(3|4|5(?!\.[0-9]-dev))|Go ).*$") {
            return 404;
        }

        proxy_pass http://docker_registry;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 900s;
        proxy_request_buffering off;
        proxy_buffering off;
        add_header Docker-Distribution-Api-Version $docker_distribution_api_version always;
    }

    location / {
        return 404;
    }
}
